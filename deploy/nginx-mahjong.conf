# nginx — reverse proxy untuk __DOMAIN__ → Mahjong Nusantara (127.0.0.1:__PORT__)
# HTTPS ditambahkan otomatis oleh certbot (install.sh).

map $http_upgrade $mahjong_conn_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;

        # WebSocket (mode online)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $mahjong_conn_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
